name: Publish original-signature APK
on:
  push:
    branches: [main]
    paths: ["releases/release.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed update publication regressions
        run: python3 -m unittest discover -s scripts/tests -p test_lumen_update_feed.py -v
      - name: Verify plugin platform consistency
        if: github.event.repository.name == 'scvtc-zhixue' || github.event.repository.name == 'lumen-timetable'
        run: python3 scripts/check_plugin_platform.py
      - name: Verify and publish the original signed local APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_signed_release.py
